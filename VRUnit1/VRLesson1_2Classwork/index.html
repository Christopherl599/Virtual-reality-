<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#153081"></a-box>
      <a-box position="-1 1.5 -3" rotation="0 59 0" color="#DDF6F9"></a-box>
      <a-sphere position="-5 1.25 -5" radius="1.25" color="#FFABB9"></a-sphere>
      <a-sphere position="5 1.25 -5" radius="1.25" color="#DAFF8D"></a-sphere>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#840017"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#F1DFCD"></a-cylinder>
      <a-cylinder position="1 0.75 -2" radius="0.5" height="1" color="#A49BE1"></a-cylinder>
      <a-cylinder position="1 0.75 -1" radius="0.5" height=".5" color="#5D6532"></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#FF9C78"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
